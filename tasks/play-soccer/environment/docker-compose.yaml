services:
  main:
    environment:
      WORLD_EPISODE_URL: http://simulator:8765
      WORLD_EPISODE_TOKEN: ${WORLD_EPISODE_TOKEN:?Set a random per-job token}
      PYTHONPATH: /opt/robotworld-client
      WORLD_AGENT_INTERFACE: ${WORLD_AGENT_INTERFACE:-native-feedback-v1}
    depends_on:
      simulator:
        condition: service_healthy
    command:
    - python
    - /opt/robotworld-client/environment/clients/harbor_entry.py
    - initialize
  simulator:
    image: world/humanoid-soccer:mujoco3.3.1
    gpus: all
    shm_size: 8gb
    entrypoint:
    - python
    working_dir: /opt/robotworld
    environment:
      PYTHONPATH: /opt/robotworld:/opt/soccer/exp
      NVIDIA_DRIVER_CAPABILITIES: all
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OMNI_KIT_ACCEPT_EULA: 'YES'
      WORLD_EPISODE_TOKEN: ${WORLD_EPISODE_TOKEN:?Set a random per-job token}
      WORLD_CONTROL_STEP_LIMIT: ${WORLD_CONTROL_STEP_LIMIT:-}
      WORLD_CODE_CONTROL: ${WORLD_CODE_CONTROL:-0}
    volumes:
    - ${WORLD_ROOT}:/opt/robotworld:ro
    - ${WORLD_ASSETS:?Set Assets path}:/opt/robotworld/Assets:ro
    - ${WORLD_ROOT}/third_party/benchmarks/humanoid_soccer/checkout:/opt/soccer:ro
    - ${WORLD_ASSETS}/humanoid_soccer/upstream/checkout:/assets:ro
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /runs/episode.json
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s
    command:
    - -m
    - environment.integrations.humanoid_soccer_eval
    - --mode
    - service
    - --service-control-mode
    - direct
    - --balance-assist
    - ankle-com
    - --scenery
    - training-pitch
    - --policy
    - /assets/ckp/policy_30000.onnx
    - --motion-path
    - /assets/motions/soccer-standard
    - --mjcf
    - /assets/source/whole_body_tracking/soccer/assets/unitree_description/mjcf/g1_actuator.xml
    - --num-trials
    - '1'
    - --seed
    - '2'
    - --sim-time
    - '20.0'
    - --output-dir
    - /runs
