services:
  main:
    environment:
      WORLD_EPISODE_URL: http://simulator:8765
      WORLD_EPISODE_TOKEN: ${WORLD_EPISODE_TOKEN:?Set a random per-job token}
      PYTHONPATH: /opt/robotworld-client
      WORLD_AGENT_INTERFACE: ${WORLD_AGENT_INTERFACE:-native-feedback-v1}
    depends_on:
      simulator:
        condition: service_healthy
    command:
    - python
    - /opt/robotworld-client/environment/clients/harbor_entry.py
    - initialize
  simulator:
    image: world/robolab:0.3.1-isaac6.0.1-experimental
    gpus: all
    shm_size: 8gb
    entrypoint:
    - python
    working_dir: /opt/robotworld
    environment:
      PYTHONPATH: /opt/isaaclab22/source/isaaclab:/opt/isaaclab22/source/isaaclab_assets:/opt/isaaclab22/source/isaaclab_tasks:/opt/robotworld:/opt/robolab:/opt/world-control-libs
      NVIDIA_DRIVER_CAPABILITIES: all
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OMNI_KIT_ACCEPT_EULA: 'YES'
      WORLD_EPISODE_TOKEN: ${WORLD_EPISODE_TOKEN:?Set a random per-job token}
      WORLD_CONTROL_STEP_LIMIT: ${WORLD_CONTROL_STEP_LIMIT:-}
      WORLD_CODE_CONTROL: ${WORLD_CODE_CONTROL:-0}
    volumes:
    - ${WORLD_ROOT}:/opt/robotworld:ro
    - ${WORLD_ASSETS:?Set Assets path}:/opt/robotworld/Assets:ro
    - ${WORLD_ROOT}/third_party/benchmarks/robolab/checkout:/opt/robolab:ro
    - ${WORLD_ASSETS}/robolab/data:/opt/robolab/assets:ro
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /runs/episode.json
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s
    command:
    - -m
    - environment.integrations.robolab_eval
    - --mode
    - service
    - --service-output
    - /runs
    - --task
    - ReorientWhiteMugsTask
    - --control-mode
    - absolute_ik
    - --world-seed
    - '7'
    - --headless
    - --isaac601-compat
