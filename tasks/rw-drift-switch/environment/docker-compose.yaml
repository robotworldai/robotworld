services:
  main:
    environment:
      WORLD_EPISODE_URL: http://simulator:8765
      WORLD_EPISODE_TOKEN: ${WORLD_EPISODE_TOKEN:?Set a random per-job token}
      PYTHONPATH: /opt/robotworld-client
      WORLD_AGENT_INTERFACE: ${WORLD_AGENT_INTERFACE:-native-feedback-v1}
    depends_on:
      simulator:
        condition: service_healthy
    command:
    - python
    - /opt/robotworld-client/environment/clients/harbor_entry.py
    - initialize
  simulator:
    image: world/wheeledlab:isaac6.0.1-experimental
    gpus: all
    shm_size: 8gb
    entrypoint:
    - python
    working_dir: /opt/robotworld
    environment:
      PYTHONPATH: /opt/isaaclab22/source/isaaclab:/opt/isaaclab22/source/isaaclab_assets:/opt/isaaclab22/source/isaaclab_tasks:/opt/isaaclab22/source/isaaclab_rl:/opt/robotworld:/opt/robotworld/third_party/benchmarks/wheeledlab/checkout/source/wheeledlab:/opt/robotworld/third_party/benchmarks/wheeledlab/checkout/source/wheeledlab_assets:/opt/robotworld/third_party/benchmarks/wheeledlab/checkout/source/wheeledlab_tasks:/opt/robotworld/third_party/benchmarks/wheeledlab/checkout/source/wheeledlab_rl
      NVIDIA_DRIVER_CAPABILITIES: all
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OMNI_KIT_ACCEPT_EULA: 'YES'
      WORLD_EPISODE_TOKEN: ${WORLD_EPISODE_TOKEN:?Set a random per-job token}
      WORLD_CONTROL_STEP_LIMIT: ${WORLD_CONTROL_STEP_LIMIT:-}
      WORLD_CODE_CONTROL: ${WORLD_CODE_CONTROL:-0}
    volumes:
    - ${WORLD_ROOT}:/opt/robotworld:ro
    - ${WORLD_ASSETS:?Set Assets path}:/opt/robotworld/Assets:ro
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /runs/episode.json
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s
    command:
    - -m
    - environment.integrations.wheeledlab_eval
    - --mode
    - service
    - --output
    - /runs
    - --case
    - rw-drift-switch
    - --steps
    - '2000'
    - --seed
    - '7'
    - --scoring-profile
    - native
