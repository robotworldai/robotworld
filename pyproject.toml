[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-robot-environment"
version = "0.1.0"
description = "Source-built Codex tools for unmodified robot benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "omegaconf>=2.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["environment*"]
exclude = ["environment.tests*"]

[tool.setuptools.package-data]
"environment.evaluation" = ["suites.json", "native17.json"]
"environment.benchmarks.robodojo" = ["LICENSE.RoboProbe", "SOURCES.json"]

[tool.pytest.ini_options]
testpaths = ["environment/tests", "tests", "environment/benchmarks"]
